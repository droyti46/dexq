[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexq-backend"
version = "0.1.0"
description = "Локальный API контроля качества DXA-исследований"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "numpy==2.2.6",
  "pillow==11.2.1",
  "pydicom==3.0.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.3",
]

[project.scripts]
dexq-batch = "app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
